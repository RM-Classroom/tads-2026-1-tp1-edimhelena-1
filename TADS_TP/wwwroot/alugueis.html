<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Aluguéis</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/">Locadora Dashboard</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/veiculos.html">Veículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/fabricantes.html">Fabricantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/pagamentos.html">Pagamentos</a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card p-3 mb-4">
            <h1 class="h3 mb-1 text-info">Aluguéis</h1>
            <p class="text-light-emphasis mb-0">Gerencie os registros de locação e seus detalhes principais.</p>
        </div>
        <section class="card p-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="aluguelForm" onsubmit="salvarAluguel(event)"><input type="hidden" id="aluguelId" />
                        <div class="mb-3"><label class="form-label text-white">Data início</label><input type="datetime-local"
                                class="form-control" id="aluguelDataInicio" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Data fim</label><input type="datetime-local"
                                class="form-control" id="aluguelDataFim" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Quilometragem inicial</label><input type="number"
                                step="0.1" class="form-control" id="aluguelQuilometragemInicial" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Valor diária</label><input type="number" step="0.01"
                                class="form-control" id="aluguelValorDiaria" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Veículo ID</label><input type="number"
                                class="form-control" id="aluguelVeiculoId" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Cliente ID</label><input type="number"
                                class="form-control" id="aluguelClienteId" required /></div>
                        <button class="btn btn-primary w-100">Salvar aluguel</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2" onclick="cancelarEdicaoAluguel()">Cancelar</button>
                    </form>
                </div>
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Cliente</th>
                                    <th>Veículo</th>
                                    <th>Início</th>
                                    <th>Fim</th>
                                    <th>Valor</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="aluguelTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Consultas especiais</h2>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label text-white">Buscar por valor</label>
                    <div class="input-group"><input type="number" step="0.01" class="form-control" id="valorFiltro" /><button class="btn btn-outline-light" type="button" onclick="buscarPorValor()">Buscar</button></div>
                </div>
                <div class="col-md-4">
                    <label class="form-label text-white">Buscar por cliente</label>
                    <div class="input-group"><input type="number" class="form-control" id="clienteFiltro" /><button class="btn btn-outline-light" type="button" onclick="buscarPorCliente()">Buscar</button></div>
                </div>
                <div class="col-md-4">
                    <button class="btn btn-outline-info w-100 h-100" type="button" onclick="buscarCompleto()">Exibir aluguéis completos</button>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead><tr><th>ID</th><th>Cliente</th><th>Veículo</th><th>Início</th><th>Fim</th><th>Valor</th></tr></thead>
                    <tbody id="consultaAluguelTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const api = '/api/Aluguel';
        async function loadAlugueis() { const { ok, data } = await request(`${api}/completo`); if (!ok) return alert('Erro ao carregar aluguéis'); renderRows('aluguelTableBody', data, a => `<tr><td>${a.id}</td><td>${a.clienteNome || '-'}</td><td>${a.veiculoModelo || '-'}</td><td>${formatDate(a.dataInicio)}</td><td>${formatDate(a.dataFim)}</td><td>R$ ${a.valorTotal?.toFixed(2) || '0,00'}</td><td><button class="btn btn-outline-warning btn-sm me-1" onclick='editarAluguel(${a.id})'>Editar</button><button class="btn btn-outline-danger btn-sm" onclick='excluirAluguel(${a.id})'>Excluir</button></td></tr>`); }
        async function buscarPorValor() { const valor = Number(document.getElementById('valorFiltro').value); if (!valor && valor !== 0) return alert('Informe um valor para pesquisar'); const { ok, data } = await request(`${api}/valor/${valor}`); if (!ok) return alert('Nenhum aluguel encontrado para esse valor'); renderRows('consultaAluguelTableBody', data, a => `<tr><td>${a.id}</td><td>-</td><td>-</td><td>${formatDate(a.dataInicio)}</td><td>${formatDate(a.dataFim)}</td><td>R$ ${a.valorTotal?.toFixed(2) || '0,00'}</td></tr>`); }
        async function buscarPorCliente() { const clienteId = Number(document.getElementById('clienteFiltro').value); if (!clienteId) return alert('Informe um ID de cliente'); const { ok, data } = await request(`${api}/cliente/${clienteId}`); if (!ok) return alert('Nenhum aluguel encontrado para esse cliente'); renderRows('consultaAluguelTableBody', data, a => `<tr><td>${a.id}</td><td>Cliente ${clienteId}</td><td>-</td><td>${formatDate(a.dataInicio)}</td><td>${formatDate(a.dataFim)}</td><td>R$ ${a.valorTotal?.toFixed(2) || '0,00'}</td></tr>`); }
        async function buscarCompleto() { const { ok, data } = await request(`${api}/completo`); if (!ok) return alert('Erro ao carregar aluguéis completos'); renderRows('consultaAluguelTableBody', data, a => `<tr><td>${a.id}</td><td>${a.clienteNome || '-'}</td><td>${a.veiculoModelo || '-'}</td><td>${formatDate(a.dataInicio)}</td><td>${formatDate(a.dataFim)}</td><td>R$ ${a.valorTotal?.toFixed(2) || '0,00'}</td></tr>`); }
        async function editarAluguel(id) { const { ok, data } = await request(`${api}/${id}`); if (!ok) return alert('Erro ao carregar aluguel para edição'); document.getElementById('aluguelId').value = data.id; document.getElementById('aluguelDataInicio').value = data.dataInicio ? data.dataInicio.slice(0, 16) : ''; document.getElementById('aluguelDataFim').value = data.dataFim ? data.dataFim.slice(0, 16) : ''; document.getElementById('aluguelQuilometragemInicial').value = data.quilometragemInicial ?? ''; document.getElementById('aluguelValorDiaria').value = data.valorDiaria ?? ''; document.getElementById('aluguelVeiculoId').value = data.veiculoId ?? ''; document.getElementById('aluguelClienteId').value = data.clienteId ?? ''; }
        async function salvarAluguel(e) { e.preventDefault(); const id = document.getElementById('aluguelId').value; const payload = { dataInicio: document.getElementById('aluguelDataInicio').value, dataFim: document.getElementById('aluguelDataFim').value, quilometragemInicial: Number(document.getElementById('aluguelQuilometragemInicial').value), valorDiaria: Number(document.getElementById('aluguelValorDiaria').value), veiculoId: Number(document.getElementById('aluguelVeiculoId').value), clienteId: Number(document.getElementById('aluguelClienteId').value) }; const res = await request(id ? `${api}/${id}` : api, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }); if (!res.ok) return alert('Erro ao salvar aluguel'); document.getElementById('aluguelId').value = ''; document.getElementById('aluguelForm').reset(); loadAlugueis(); }
        async function excluirAluguel(id) { if (!confirm('Confirmar exclusão?')) return; const res = await request(`${api}/${id}`, { method: 'DELETE' }); if (!res.ok) return alert('Erro ao excluir aluguel'); loadAlugueis(); }
        function cancelarEdicaoAluguel() { document.getElementById('aluguelId').value = ''; document.getElementById('aluguelForm').reset(); }
        window.addEventListener('load', loadAlugueis);
    </script>
</body>

</html>

<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagamentos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/">Locadora Dashboard</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/veiculos.html">Veículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/fabricantes.html">Fabricantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/alugueis.html">Aluguéis</a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card p-3 mb-4">
            <h1 class="h3 mb-1 text-info">Pagamentos</h1>
            <p class="text-light-emphasis mb-0">Acompanhe valores e status das cobranças do sistema.</p>
        </div>
        <section class="card p-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="pagamentoForm" onsubmit="salvarPagamento(event)"><input type="hidden" id="pagamentoId" />
                        <div class="mb-3"><label class="form-label text-white">Data pagamento</label><input type="datetime-local"
                                class="form-control" id="pagamentoDataPagamento" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Valor</label><input type="number" step="0.01"
                                class="form-control" id="pagamentoValor" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Status</label><input class="form-control"
                                id="pagamentoStatus" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Aluguel ID</label><input type="number"
                                class="form-control" id="pagamentoAluguelId" required /></div>
                        <button class="btn btn-primary w-100">Salvar pagamento</button>
                    </form>
                </div>
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Valor</th>
                                    <th>Status</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="pagamentoTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Pagamentos por aluguel</h2>
            <div class="row g-3 align-items-end">
                <div class="col-md-8"><label class="form-label text-white">ID do aluguel</label><input type="number" class="form-control" id="aluguelPagamentoFiltro" /></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" type="button" onclick="buscarPorAluguel()">Buscar</button></div>
            </div>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead><tr><th>ID</th><th>Valor</th><th>Status</th></tr></thead>
                    <tbody id="consultaPagamentoTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const api = '/api/Pagamento';
        async function loadPagamentos() { const { ok, data } = await request(api); if (!ok) return alert('Erro ao carregar pagamentos'); renderRows('pagamentoTableBody', data, p => `<tr><td>${p.id}</td><td>R$ ${p.valor?.toFixed(2) || '0,00'}</td><td>${p.status}</td><td><button class="btn btn-outline-warning btn-sm me-1" onclick='editarPagamento(${JSON.stringify(p)})'>Editar</button><button class="btn btn-outline-danger btn-sm" onclick='excluirPagamento(${p.id})'>Excluir</button></td></tr>`); }
        async function buscarPorAluguel() { const aluguelId = Number(document.getElementById('aluguelPagamentoFiltro').value); if (!aluguelId) return alert('Informe um ID de aluguel'); const { ok, data } = await request(`${api}/aluguel/${aluguelId}`); if (!ok) return alert('Nenhum pagamento encontrado para esse aluguel'); renderRows('consultaPagamentoTableBody', data, p => `<tr><td>${p.id}</td><td>R$ ${p.valor?.toFixed(2) || '0,00'}</td><td>${p.status}</td></tr>`); }
        function editarPagamento(p) { document.getElementById('pagamentoId').value = p.id; document.getElementById('pagamentoDataPagamento').value = p.dataPagamento ? p.dataPagamento.slice(0, 16) : ''; document.getElementById('pagamentoValor').value = p.valor; document.getElementById('pagamentoStatus').value = p.status; document.getElementById('pagamentoAluguelId').value = p.aluguelId || ''; }
        async function salvarPagamento(e) { e.preventDefault(); const id = document.getElementById('pagamentoId').value; const payload = { dataPagamento: document.getElementById('pagamentoDataPagamento').value, valor: Number(document.getElementById('pagamentoValor').value), status: document.getElementById('pagamentoStatus').value, aluguelId: Number(document.getElementById('pagamentoAluguelId').value) }; const res = await request(id ? `${api}/${id}` : api, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }); if (!res.ok) return alert('Erro ao salvar pagamento'); e.target.reset(); loadPagamentos(); }
        async function excluirPagamento(id) { if (!confirm('Confirmar exclusão?')) return; const res = await request(`${api}/${id}`, { method: 'DELETE' }); if (!res.ok) return alert('Erro ao excluir pagamento'); loadPagamentos(); }
        window.addEventListener('load', loadPagamentos);
    </script>
</body>

</html>

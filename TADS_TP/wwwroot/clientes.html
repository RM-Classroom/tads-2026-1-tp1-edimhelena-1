<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/">Locadora Dashboard</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/veiculos.html">Veículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/fabricantes.html">Fabricantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/alugueis.html">Aluguéis</a></li>
                <li class="nav-item"><a class="nav-link" href="/pagamentos.html">Pagamentos</a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card p-3 mb-4">
            <h1 class="h3 mb-1 text-info">Clientes</h1>
            <p class="text-light-emphasis mb-0">Cadastre, edite e remova clientes da locadora.</p>
        </div>
        <section class="card p-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="clienteForm" onsubmit="salvarCliente(event)"><input type="hidden" id="clienteId" />
                        <div class="mb-3"><label class="form-label text-white">Nome</label><input class="form-control"
                                id="clienteNome" required /></div>
                        <div class="mb-3"><label class="form-label text-white">CPF</label><input class="form-control"
                                id="clienteCpf" required /></div>
                        <div class="mb-3"><label class="form-label text-white">E-mail</label><input type="email"
                                class="form-control" id="clienteEmail" required /></div>
                        <button class="btn btn-primary w-100">Salvar cliente</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2"
                            onclick="cancelarEdicao()">Cancelar</button>
                    </form>
                </div>
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>CPF</th>
                                    <th>Email</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="clienteTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Buscar cliente por ID</h2>
            <div class="row g-3 align-items-end">
                <div class="col-md-8"><label class="form-label text-white">ID do cliente</label><input type="number"
                        class="form-control" id="clienteIdFiltro" /></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" type="button"
                        onclick="buscarPorId()">Buscar</button></div>
            </div>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>CPF</th>
                            <th>Email</th>
                        </tr>
                    </thead>
                    <tbody id="consultaClienteTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const api = '/api/Cliente';
        async function loadClientes() { const { ok, data } = await request(api); if (!ok) return alert('Erro ao carregar clientes'); renderRows('clienteTableBody', data, c => `<tr><td>${c.id}</td><td>${c.nome}</td><td>${c.cpf}</td><td>${c.email}</td><td><button class="btn btn-outline-warning btn-sm me-1" onclick='editarCliente(${JSON.stringify(c)})'>Editar</button><button class="btn btn-outline-danger btn-sm" onclick='excluirCliente(${c.id})'>Excluir</button></td></tr>`); }
        function editarCliente(c) { document.getElementById('clienteId').value = c.id; document.getElementById('clienteNome').value = c.nome; document.getElementById('clienteCpf').value = c.cpf; document.getElementById('clienteEmail').value = c.email; }
        async function salvarCliente(e) { e.preventDefault(); const id = document.getElementById('clienteId').value; const payload = { id: id ? parseInt(id) : 0, nome: document.getElementById('clienteNome').value, cpf: document.getElementById('clienteCpf').value, email: document.getElementById('clienteEmail').value }; const res = await request(id ? `${api}/${id}` : api, { method: id ? 'PUT' : 'POST', body: JSON.stringify(payload) }); if (!res.ok) return alert('Erro ao salvar cliente'); e.target.reset(); loadClientes(); }
        async function excluirCliente(id) { if (!confirm('Confirmar exclusão?')) return; const res = await request(`${api}/${id}`, { method: 'DELETE' }); if (!res.ok) return alert('Erro ao excluir cliente'); loadClientes(); }
        async function buscarPorId() {
            const id = document.getElementById('clienteIdFiltro').value;
            if (!id) return alert('Digite um ID');
            const { ok, data } = await request(`${api}/${id}`);
            if (!ok) return alert('Cliente não encontrado');
            renderRows('consultaClienteTableBody', [data], c =>
                `<tr><td>${c.id}</td><td>${c.nome}</td><td>${c.cpf}</td><td>${c.email}</td></tr>`
            );
        }
        function cancelarEdicao() {
            document.getElementById('clienteId').value = '';
            document.getElementById('clienteForm').reset();
        }
        window.addEventListener('load', loadClientes);
    </script>
</body>

</html>

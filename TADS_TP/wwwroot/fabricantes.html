<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Fabricantes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/">Locadora Dashboard</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/veiculos.html">Veículos</a></li>
                <li class="nav-item"><a class="nav-link" href="/alugueis.html">Aluguéis</a></li>
                <li class="nav-item"><a class="nav-link" href="/pagamentos.html">Pagamentos</a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card p-3 mb-4">
            <h1 class="h3 mb-1 text-info">Fabricantes</h1>
            <p class="text-light-emphasis mb-0">Cadastre os parceiros e seus contatos de suporte.</p>
        </div>
        <section class="card p-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="fabricanteForm" onsubmit="salvarFabricante(event)"><input type="hidden"
                            id="fabricanteId" />
                        <div class="mb-3"><label class="form-label text-white">Nome</label><input class="form-control"
                                id="fabricanteNome" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Contato</label><input
                                class="form-control" id="fabricanteContato" required /></div>
                        <button class="btn btn-primary w-100">Salvar fabricante</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2"
                            onclick="cancelarEdicao()">Cancelar</button>
                    </form>
                </div>
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Nome</th>
                                    <th>Contato</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="fabricanteTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Buscar fabricante por ID</h2>
            <div class="row g-3 align-items-end">
                <div class="col-md-8"><label class="form-label text-white">ID do fabricante</label><input type="number"
                        class="form-control" id="fabricanteIdFiltro" /></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" type="button"
                        onclick="buscarPorId()">Buscar</button></div>
            </div>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nome</th>
                            <th>Contato</th>
                        </tr>
                    </thead>
                    <tbody id="consultaFabricanteTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const api = '/api/Fabricante';
        async function loadFabricantes() { const { ok, data } = await request(api); if (!ok) return alert('Erro ao carregar fabricantes'); renderRows('fabricanteTableBody', data, f => `<tr><td>${f.id}</td><td>${f.nome}</td><td>${f.contato}</td><td><button class="btn btn-outline-warning btn-sm me-1" onclick='editarFabricante(${JSON.stringify(f)})'>Editar</button><button class="btn btn-outline-danger btn-sm" onclick='excluirFabricante(${f.id})'>Excluir</button></td></tr>`); }
        function editarFabricante(f) { document.getElementById('fabricanteId').value = f.id; document.getElementById('fabricanteNome').value = f.nome; document.getElementById('fabricanteContato').value = f.contato; }
        async function salvarFabricante(e) {
            e.preventDefault();
            const id = document.getElementById('fabricanteId').value;
            const payload = {
                id: id ? parseInt(id) : 0,
                nome: document.getElementById('fabricanteNome').value,
                contato: document.getElementById('fabricanteContato').value
            };
            const res = await request(id ? `${api}/${id}` : api, {
                method: id ? 'PUT' : 'POST',
                body: JSON.stringify(payload)
            });
            if (!res.ok) return alert('Erro ao salvar fabricante');
            document.getElementById('fabricanteId').value = '';
            e.target.reset();
            loadFabricantes();
        }
        async function excluirFabricante(id) { if (!confirm('Confirmar exclusão?')) return; const res = await request(`${api}/${id}`, { method: 'DELETE' }); if (!res.ok) return alert('Erro ao excluir fabricante'); loadFabricantes(); }
        function cancelarEdicao() {
            document.getElementById('fabricanteId').value = '';
            document.getElementById('fabricanteForm').reset();
        }
        async function buscarPorId() {
            const id = document.getElementById('fabricanteIdFiltro').value;
            if (!id) return alert('Digite um ID');
            const { ok, data } = await request(`${api}/${id}`);
            if (!ok) return alert('Fabricante não encontrado');
            renderRows('consultaFabricanteTableBody', [data], f =>
                `<tr><td>${f.id}</td><td>${f.nome}</td><td>${f.contato}</td></tr>`
            );
        }
        window.addEventListener('load', loadFabricantes);
    </script>
</body>

</html>

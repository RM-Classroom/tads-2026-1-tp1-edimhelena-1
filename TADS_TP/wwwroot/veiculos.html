<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Veículos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/css/app.css" rel="stylesheet" />
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm sticky-top">
        <div class="container-fluid"><a class="navbar-brand fw-semibold" href="/">Locadora Dashboard</a>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="/clientes.html">Clientes</a></li>
                <li class="nav-item"><a class="nav-link" href="/fabricantes.html">Fabricantes</a></li>
                <li class="nav-item"><a class="nav-link" href="/alugueis.html">Aluguéis</a></li>
                <li class="nav-item"><a class="nav-link" href="/pagamentos.html">Pagamentos</a></li>
            </ul>
        </div>
    </nav>
    <main class="container py-4">
        <div class="card p-3 mb-4">
            <h1 class="h3 mb-1 text-info">Veículos</h1>
            <p class="text-light-emphasis mb-0">Gerencie a frota e os vínculos com os fabricantes.</p>
        </div>
        <section class="card p-4">
            <div class="row g-4">
                <div class="col-lg-4">
                    <form id="veiculoForm" onsubmit="salvarVeiculo(event)"><input type="hidden" id="veiculoId" />
                        <div class="mb-3"><label class="form-label text-white">Modelo</label><input class="form-control"
                                id="veiculoModelo" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Ano</label><input type="number"
                                class="form-control" id="veiculoAno" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Quilometragem</label><input type="number"
                                step="0.1" class="form-control" id="veiculoQuilometragem" required /></div>
                        <div class="mb-3"><label class="form-label text-white">Fabricante ID</label><input type="number"
                                class="form-control" id="veiculoFabricanteId" required /></div>
                        <button class="btn btn-primary w-100">Salvar veículo</button>
                        <button type="button" class="btn btn-secondary w-100 mt-2"
                            onclick="cancelarEdicao()">Cancelar</button>
                    </form>
                </div>
                <div class="col-lg-8">
                    <div class="table-responsive">
                        <table class="table table-dark table-striped align-middle mb-0">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Modelo</th>
                                    <th>Ano</th>
                                    <th>Km</th>
                                    <th>Fabricante</th>
                                    <th>Ações</th>
                                </tr>
                            </thead>
                            <tbody id="veiculoTableBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>

        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Filtro por fabricante</h2>
            <div class="row g-3 align-items-end">
                <div class="col-md-8"><label class="form-label text-white">Nome do fabricante</label><input
                        class="form-control" id="fabricanteFiltro" placeholder="Ex.: Fiat" /></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" type="button"
                        onclick="buscarPorFabricante()">Buscar veículos</button></div>
            </div>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Modelo</th>
                            <th>Ano</th>
                            <th>Km</th>
                            <th>Fabricante</th>
                        </tr>
                    </thead>
                    <tbody id="consultaVeiculoTableBody"></tbody>
                </table>
            </div>
        </section>
        <section class="card p-4 mt-4">
            <h2 class="h5 mb-3 text-info">Buscar veículo por ID</h2>
            <div class="row g-3 align-items-end">
                <div class="col-md-8"><label class="form-label text-white">ID do veículo</label><input type="number"
                        class="form-control" id="veiculoIdFiltro" /></div>
                <div class="col-md-4"><button class="btn btn-outline-light w-100" type="button"
                        onclick="buscarPorId()">Buscar</button></div>
            </div>
            <div class="table-responsive mt-3">
                <table class="table table-dark table-striped align-middle mb-0">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Modelo</th>
                            <th>Ano</th>
                            <th>Km</th>
                            <th>Fabricante ID</th>
                        </tr>
                    </thead>
                    <tbody id="consultaVeiculoIdTableBody"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/ui.js"></script>
    <script>
        const api = '/api/Veiculo';
        async function loadVeiculos() { const { ok, data } = await request(api); if (!ok) return alert('Erro ao carregar veículos'); renderRows('veiculoTableBody', data, v => `<tr><td>${v.id}</td><td>${v.modelo}</td><td>${v.ano}</td><td>${v.quilometragem}</td><td>${v.fabricanteId}</td><td><button class="btn btn-outline-warning btn-sm me-1" onclick='editarVeiculo(${JSON.stringify(v)})'>Editar</button><button class="btn btn-outline-danger btn-sm" onclick='excluirVeiculo(${v.id})'>Excluir</button></td></tr>`); }
        async function buscarPorFabricante() { const nome = document.getElementById('fabricanteFiltro').value.trim(); if (!nome) return alert('Informe um nome de fabricante'); const { ok, data } = await request(`${api}/fabricante/${encodeURIComponent(nome)}`); if (!ok) return alert('Nenhum veículo encontrado para esse fabricante'); renderRows('consultaVeiculoTableBody', data, v => `<tr><td>${v.id}</td><td>${v.modelo}</td><td>${v.ano}</td><td>${v.quilometragem}</td><td>${v.fabricanteId}</td></tr>`); }
        function editarVeiculo(v) { document.getElementById('veiculoId').value = v.id; document.getElementById('veiculoModelo').value = v.modelo; document.getElementById('veiculoAno').value = v.ano; document.getElementById('veiculoQuilometragem').value = v.quilometragem; document.getElementById('veiculoFabricanteId').value = v.fabricanteId; }
        async function salvarVeiculo(e) {
            e.preventDefault();
            const id = document.getElementById('veiculoId').value;
            const fabricanteId = document.getElementById('veiculoFabricanteId').value;
            console.log('fabricanteId capturado:', fabricanteId);

            const payload = {
                id: id ? parseInt(id) : 0,
                modelo: document.getElementById('veiculoModelo').value,
                ano: Number(document.getElementById('veiculoAno').value),
                quilometragem: Number(document.getElementById('veiculoQuilometragem').value),
                fabricanteId: Number(document.getElementById('veiculoFabricanteId').value)
            };

            console.log('payload completo:', payload);
            const res = await request(id ? `${api}/${id}` : api, {
                method: id ? 'PUT' : 'POST',
                body: JSON.stringify(payload)
            });
            if (!res.ok) return alert('Erro ao salvar veículo');
            document.getElementById('veiculoId').value = '';
            e.target.reset();
            loadVeiculos();
        }
        async function excluirVeiculo(id) { if (!confirm('Confirmar exclusão?')) return; const res = await request(`${api}/${id}`, { method: 'DELETE' }); if (!res.ok) return alert('Erro ao excluir veículo'); loadVeiculos(); }
        function cancelarEdicao() {
            document.getElementById('veiculoId').value = '';
            document.getElementById('veiculoForm').reset();
        }
        async function buscarPorId() {
            const id = document.getElementById('veiculoIdFiltro').value;
            if (!id) return alert('Digite um ID');
            const { ok, data } = await request(`${api}/${id}`);
            if (!ok) return alert('Veículo não encontrado');
            renderRows('consultaVeiculoIdTableBody', [data], v =>
                `<tr><td>${v.id}</td><td>${v.modelo}</td><td>${v.ano}</td><td>${v.quilometragem}</td><td>${v.fabricanteId}</td></tr>`
            );
        }
        window.addEventListener('load', loadVeiculos);
    </script>
</body>

</html>
